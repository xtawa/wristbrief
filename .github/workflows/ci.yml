name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  release-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python scripts/release_guard.py

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Test and build debug apps
        run: gradle :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest :mobile:testDebugUnitTest :mobile:assembleDebug :mobile:assembleDebugAndroidTest --stacktrace
      - name: Build unsigned release artifacts
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: gradle :app:assembleRelease :app:bundleRelease :mobile:assembleRelease :mobile:bundleRelease --stacktrace
      - name: Upload Wear release artifacts
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: wristbrief-wear-release-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
      - name: Upload Mobile release artifacts
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: wristbrief-mobile-release-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            mobile/build/outputs/apk/release/*.apk
            mobile/build/outputs/bundle/release/*.aab

  instrumentation-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Accept Android SDK licenses
        run: |
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          sdkmanager_path="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$sdkmanager_path" ]; then
            sdkmanager_path="$(find "$sdk_root/cmdline-tools" -type f -path '*/bin/sdkmanager' -print | sort | tail -n 1)"
          fi
          test -x "$sdkmanager_path"
          yes | "$sdkmanager_path" --licenses >/dev/null
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Mobile instrumentation smoke test
        run: gradle :mobile:pixel2api30DebugAndroidTest --stacktrace
      - name: Upload instrumentation reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-instrumentation-reports-${{ github.sha }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            mobile/build/reports/androidTests/**
            mobile/build/outputs/androidTest-results/**

  instrumentation-wear:
    name: instrumentation-wear-${{ matrix.profile }}-font-${{ matrix.font_scale }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: wearos_small_round
            font_scale: '1.30'
          - profile: wearos_large_round
            font_scale: '1.00'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Wear round-profile instrumentation smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: android-wear
          arch: x86
          profile: ${{ matrix.profile }}
          script: |
            if [ "${{ matrix.font_scale }}" != "1.00" ]; then
              adb shell settings put system font_scale ${{ matrix.font_scale }}
              actual_font_scale="$(adb shell settings get system font_scale | tr -d '\r')"
              test "$actual_font_scale" = "${{ matrix.font_scale }}"
            fi
            gradle :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.expectedFontScale=${{ matrix.font_scale }} --stacktrace
            for tile_service in .tile.LatestUnreadTileService .tile.ContinueListeningTileService; do
              component="ink.underflo.wristbrief/$tile_service"
              add_output="$(adb shell am broadcast -a com.google.android.wearable.app.DEBUG_SURFACE --es operation add-tile --ecn component "$component" | tr -d '\r')"
              echo "$add_output"
              echo "$add_output" | grep -q 'result=1'
              tile_index="$(printf '%s\n' "$add_output" | sed -n 's/.*Index=\[\([0-9][0-9]*\)\].*/\1/p')"
              test -n "$tile_index"
              show_output="$(adb shell am broadcast -a com.google.android.wearable.app.DEBUG_SYSUI --es operation show-tile --ei index "$tile_index" | tr -d '\r')"
              echo "$show_output"
              echo "$show_output" | grep -q 'result=1'
              remove_output="$(adb shell am broadcast -a com.google.android.wearable.app.DEBUG_SURFACE --es operation remove-tile --ecn component "$component" | tr -d '\r')"
              echo "$remove_output"
              echo "$remove_output" | grep -q 'result=1'
            done
      - name: Upload instrumentation reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: wear-instrumentation-reports-${{ matrix.profile }}-${{ github.sha }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            app/build/reports/androidTests/**
            app/build/outputs/androidTest-results/**

  gateway:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run typecheck
      - run: npm test
