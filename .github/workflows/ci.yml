name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  release-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python scripts/release_guard.py

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Test and build debug apps
        run: gradle :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest :mobile:testDebugUnitTest :mobile:assembleDebug :mobile:assembleDebugAndroidTest --stacktrace
      - name: Build unsigned release artifacts
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: gradle :app:assembleRelease :app:bundleRelease :mobile:assembleRelease :mobile:bundleRelease --stacktrace
      - name: Upload Wear release artifacts
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: wristbrief-wear-release-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
      - name: Upload Mobile release artifacts
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: wristbrief-mobile-release-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            mobile/build/outputs/apk/release/*.apk
            mobile/build/outputs/bundle/release/*.aab

  instrumentation-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Mobile instrumentation smoke test
        run: gradle :mobile:pixel2api30DebugAndroidTest --stacktrace
      - name: Upload instrumentation reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-instrumentation-reports-${{ github.sha }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            mobile/build/reports/androidTests/**
            mobile/build/outputs/androidTest-results/**

  gateway:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run typecheck
      - run: npm test
