name: Native UX evaluation

on:
  pull_request:
    paths:
      - 'mobile/**'
      - 'app/**'
      - '.github/workflows/ux-evaluation.yml'
      - 'scripts/capture_ux.sh'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ux-evaluation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phone-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: en-light
            locale: en-US
            theme: light
            font: '1.0'
            size: 1080x2160
          - name: en-dark
            locale: en-US
            theme: dark
            font: '1.0'
            size: 1080x2160
          - name: zh-light-large
            locale: zh-CN
            theme: light
            font: '1.3'
            size: 960x1920
          - name: zh-dark-large
            locale: zh-CN
            theme: dark
            font: '1.3'
            size: 960x1920
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Enable KVM
        run: sudo chmod 666 /dev/kvm
      - name: Compile evidence APKs
        run: gradle :mobile:assembleDebug :mobile:assembleDebugAndroidTest --max-workers=2
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_2
          script: bash scripts/capture_ux.sh mobile '${{ matrix.locale }}' '${{ matrix.theme }}' '${{ matrix.font }}' '${{ matrix.size }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-ux-phone-${{ matrix.name }}-${{ github.sha }}
          path: mobile/build/ux-evidence/
          if-no-files-found: error
          retention-days: 14

  wear-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: wearos_small_round
            font: '1.3'
          - profile: wearos_large_round
            font: '1.0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Enable KVM
        run: sudo chmod 666 /dev/kvm
      - name: Compile evidence APKs
        run: gradle :app:assembleDebug :app:assembleDebugAndroidTest --max-workers=2
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: android-wear
          arch: x86
          profile: ${{ matrix.profile }}
          script: bash scripts/capture_ux.sh app en-US dark '${{ matrix.font }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-ux-wear-${{ matrix.profile }}-${{ github.sha }}
          path: app/build/ux-evidence/
          if-no-files-found: error
          retention-days: 14
