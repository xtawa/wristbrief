<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000000" flood-opacity="0.10"/>
    </filter>
    <style>
      .title{font:700 34px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#111317}
      .subtitle{font:400 17px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#68707A}
      .phoneTitle{font:700 24px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#111317}
      .h2{font:650 18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#111317}
      .body{font:400 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#646B75}
      .label{font:600 12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#111317}
      .small{font:500 11px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#707780}
      .status{font:700 10px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#111317}
      .phone{fill:#F9FAFB;stroke:#D7DBE1;stroke-width:1.5}
      .glass{fill:#FFFFFF;fill-opacity:.68;stroke:#D9DEE6;stroke-opacity:.82;stroke-width:1}
      .glassStrong{fill:#FFFFFF;fill-opacity:.86;stroke:#D9DEE6;stroke-opacity:.90;stroke-width:1}
      .chip{fill:#FFFFFF;fill-opacity:.60;stroke:#D9DEE6;stroke-width:1}
      .chipOn{fill:#17191D;stroke:#17191D;stroke-width:1}
      .chipTextOn{font:600 11px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#FFFFFF}
      .navText{font:500 10px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#707780}
      .navOn{font:600 10px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#FFFFFF}
    </style>
  </defs>

  <rect width="1600" height="1000" fill="#EEF0F3"/>
  <text x="56" y="58" class="title">WristBrief · Phone Liquid Glass</text>
  <text x="56" y="88" class="subtitle">Quiet glass surfaces · monochrome hierarchy · no gradients · Wear OS unchanged</text>
  <rect x="1298" y="34" width="246" height="48" rx="24" class="glassStrong"/>
  <text x="1421" y="64" text-anchor="middle" class="label">PHONE UI ONLY · NO GRADIENTS</text>

  <g transform="translate(52,130)" filter="url(#shadow)">
    <text x="0" y="-18" class="small">01 · Welcome</text>
    <rect width="270" height="390" rx="34" class="phone"/>
    <text x="22" y="30" class="status">9:41</text>
    <circle cx="135" cy="112" r="56" fill="#FFFFFF" fill-opacity=".54" stroke="#D7DBE1"/>
    <ellipse cx="135" cy="112" rx="23" ry="12" fill="#C9CDD3"/>
    <text x="22" y="205" class="phoneTitle">Less noise.</text>
    <text x="22" y="235" class="phoneTitle">More you.</text>
    <text x="22" y="270" class="body">Turn feeds, podcasts and AI</text>
    <text x="22" y="291" class="body">into a clear daily brief.</text>
    <rect x="22" y="326" width="226" height="44" rx="22" class="glassStrong"/>
    <text x="135" y="354" text-anchor="middle" class="label">Get started →</text>
  </g>

  <g transform="translate(356,130)" filter="url(#shadow)">
    <text x="0" y="-18" class="small">02 · Interests</text>
    <rect width="270" height="390" rx="34" class="phone"/>
    <text x="22" y="30" class="status">9:41</text>
    <text x="22" y="86" class="phoneTitle">What interests</text>
    <text x="22" y="116" class="phoneTitle">you?</text>
    <text x="22" y="142" class="body">Choose a few topics.</text>
    <rect x="22" y="168" width="105" height="34" rx="17" class="chipOn"/>
    <text x="74" y="190" text-anchor="middle" class="chipTextOn">Technology</text>
    <rect x="137" y="168" width="95" height="34" rx="17" class="chip"/>
    <text x="184" y="190" text-anchor="middle" class="label">Science</text>
    <rect x="22" y="212" width="92" height="34" rx="17" class="chip"/>
    <text x="68" y="234" text-anchor="middle" class="label">Business</text>
    <rect x="124" y="212" width="90" height="34" rx="17" class="chipOn"/>
    <text x="169" y="234" text-anchor="middle" class="chipTextOn">Design</text>
    <rect x="22" y="256" width="72" height="34" rx="17" class="chip"/>
    <text x="58" y="278" text-anchor="middle" class="label">AI</text>
    <rect x="104" y="256" width="104" height="34" rx="17" class="chip"/>
    <text x="156" y="278" text-anchor="middle" class="label">Health</text>
    <rect x="22" y="326" width="226" height="44" rx="22" class="glassStrong"/>
    <text x="135" y="354" text-anchor="middle" class="label">Continue →</text>
  </g>

  <g transform="translate(660,130)" filter="url(#shadow)">
    <text x="0" y="-18" class="small">03 · Add content</text>
    <rect width="270" height="390" rx="34" class="phone"/>
    <text x="22" y="30" class="status">9:41</text>
    <text x="22" y="86" class="phoneTitle">Add your content</text>
    <text x="22" y="114" class="body">Connect what you care about.</text>
    <rect x="20" y="145" width="230" height="54" rx="18" class="glass"/>
    <text x="40" y="168" class="h2">RSS feeds</text><text x="40" y="188" class="small">Import RSS or OPML</text><text x="228" y="177" class="h2">+</text>
    <rect x="20" y="210" width="230" height="54" rx="18" class="glass"/>
    <text x="40" y="233" class="h2">Podcasts</text><text x="40" y="253" class="small">Search or paste a link</text><text x="228" y="242" class="h2">+</text>
    <rect x="20" y="275" width="230" height="54" rx="18" class="glass"/>
    <text x="40" y="298" class="h2">Import</text><text x="40" y="318" class="small">Bring existing sources</text><text x="228" y="307" class="h2">+</text>
    <rect x="22" y="336" width="226" height="40" rx="20" class="glassStrong"/>
    <text x="135" y="362" text-anchor="middle" class="label">Continue →</text>
  </g>

  <g transform="translate(964,130)" filter="url(#shadow)">
    <text x="0" y="-18" class="small">04 · AI features</text>
    <rect width="270" height="390" rx="34" class="phone"/>
    <text x="22" y="30" class="status">9:41</text>
    <text x="22" y="86" class="phoneTitle">Unlock more</text>
    <text x="22" y="116" class="phoneTitle">with AI</text>
    <rect x="20" y="148" width="230" height="54" rx="18" class="glass"/>
    <text x="40" y="170" class="h2">Daily Brief</text><text x="40" y="190" class="small">5–10 key insights</text>
    <rect x="20" y="212" width="230" height="54" rx="18" class="glass"/>
    <text x="40" y="234" class="h2">Ask AI</text><text x="40" y="254" class="small">Answers from your content</text>
    <rect x="20" y="276" width="230" height="54" rx="18" class="glass"/>
    <text x="40" y="298" class="h2">Listen instead</text><text x="40" y="318" class="small">Natural narration</text>
    <rect x="22" y="336" width="226" height="40" rx="20" class="glassStrong"/>
    <text x="135" y="362" text-anchor="middle" class="label">Continue →</text>
  </g>

  <g transform="translate(1268,130)" filter="url(#shadow)">
    <text x="0" y="-18" class="small">05 · Ready</text>
    <rect width="270" height="390" rx="34" class="phone"/>
    <text x="22" y="30" class="status">9:41</text>
    <text x="22" y="96" class="phoneTitle">You’re all set.</text>
    <text x="22" y="125" class="body">WristBrief is ready.</text>
    <rect x="20" y="158" width="230" height="144" rx="24" class="glassStrong"/>
    <text x="40" y="190" class="h2">✓  Feeds connected</text>
    <text x="40" y="224" class="h2">✓  Interests personalized</text>
    <text x="40" y="258" class="h2">✓  AI ready</text>
    <text x="40" y="292" class="h2">✓  Sync enabled</text>
    <rect x="22" y="326" width="226" height="44" rx="22" fill="#17191D"/>
    <text x="135" y="354" text-anchor="middle" class="chipTextOn">Start exploring →</text>
  </g>

  <g transform="translate(52,594)" filter="url(#shadow)">
    <text x="0" y="-18" class="small">Home · Daily Brief first</text>
    <rect width="350" height="354" rx="36" class="phone"/>
    <text x="22" y="30" class="status">9:41</text>
    <text x="22" y="72" class="phoneTitle">Good morning,</text>
    <text x="22" y="94" class="body">Here’s your brief for today.</text>
    <rect x="20" y="118" width="310" height="70" rx="24" class="glassStrong"/>
    <text x="42" y="145" class="h2">Today’s Brief</text><text x="42" y="166" class="small">8 key insights · 6 min</text>
    <circle cx="300" cy="153" r="22" fill="#17191D"/><text x="300" y="158" text-anchor="middle" class="chipTextOn">▶</text>
    <rect x="20" y="202" width="78" height="30" rx="15" class="chipOn"/><text x="59" y="221" text-anchor="middle" class="chipTextOn">For you</text>
    <rect x="106" y="202" width="68" height="30" rx="15" class="chip"/><text x="140" y="221" text-anchor="middle" class="label">Latest</text>
    <rect x="182" y="202" width="82" height="30" rx="15" class="chip"/><text x="223" y="221" text-anchor="middle" class="label">Podcasts</text>
    <rect x="22" y="248" width="52" height="44" rx="12" fill="#DDE1E6"/><text x="88" y="264" class="label">The next wave of AI agents</text><text x="88" y="282" class="small">The Verge · 4 min</text>
    <rect x="18" y="306" width="314" height="36" rx="18" class="glassStrong"/>
    <text x="72" y="329" class="navOn">● Home</text><text x="148" y="329" class="navText">Explore</text><text x="220" y="329" class="navText">Ask</text><text x="275" y="329" class="navText">Library</text>
  </g>

  <g transform="translate(446,594)" filter="url(#shadow)">
    <text x="0" y="-18" class="small">Explore · readable feed list</text>
    <rect width="350" height="354" rx="36" class="phone"/>
    <text x="22" y="30" class="status">9:41</text>
    <text x="22" y="72" class="phoneTitle">Explore</text>
    <rect x="20" y="92" width="310" height="40" rx="20" class="glass"/><text x="42" y="118" class="body">Search sources, topics, podcasts…</text>
    <text x="22" y="162" class="label">ALL</text><text x="75" y="162" class="small">Articles</text><text x="140" y="162" class="small">Podcasts</text><text x="214" y="162" class="small">Videos</text>
    <line x1="20" y1="178" x2="330" y2="178" stroke="#D9DEE6"/>
    <rect x="22" y="192" width="48" height="48" rx="12" fill="#DDE1E6"/><text x="84" y="207" class="label">Why good design still matters</text><text x="84" y="226" class="small">Fast Company · 5 min</text>
    <line x1="20" y1="250" x2="330" y2="250" stroke="#D9DEE6"/>
    <rect x="22" y="264" width="48" height="48" rx="12" fill="#DDE1E6"/><text x="84" y="279" class="label">A more open internet</text><text x="84" y="298" class="small">The Atlantic · 6 min</text>
    <rect x="18" y="306" width="314" height="36" rx="18" class="glassStrong"/>
    <text x="64" y="329" class="navText">Home</text><text x="137" y="329" class="navOn">● Explore</text><text x="226" y="329" class="navText">Ask</text><text x="280" y="329" class="navText">Library</text>
  </g>

  <g transform="translate(840,594)" filter="url(#shadow)">
    <text x="0" y="-18" class="small">Now Playing · no gradient backdrop</text>
    <rect width="350" height="354" rx="36" fill="#E5E7EA" stroke="#D7DBE1" stroke-width="1.5"/>
    <text x="22" y="30" class="status">9:41</text>
    <rect x="105" y="66" width="140" height="140" rx="28" fill="#C9CDD3"/>
    <text x="175" y="236" text-anchor="middle" class="h2">The AI Productivity Shift</text>
    <text x="175" y="258" text-anchor="middle" class="small">TechCrunch</text>
    <line x1="54" y1="284" x2="296" y2="284" stroke="#AAB0B8" stroke-width="4" stroke-linecap="round"/><line x1="54" y1="284" x2="170" y2="284" stroke="#17191D" stroke-width="4" stroke-linecap="round"/>
    <circle cx="175" cy="320" r="24" fill="#17191D"/><text x="175" y="325" text-anchor="middle" class="chipTextOn">Ⅱ</text>
    <text x="92" y="325" class="label">−15</text><text x="246" y="325" class="label">+15</text>
  </g>

  <g transform="translate(1234,594)" filter="url(#shadow)">
    <text x="0" y="-18" class="small">Ask AI · normal productivity surface</text>
    <rect width="314" height="354" rx="36" class="phone"/>
    <text x="22" y="30" class="status">9:41</text>
    <text x="22" y="74" class="phoneTitle">Ask AI</text>
    <rect x="20" y="104" width="274" height="48" rx="18" class="glass"/><text x="38" y="133" class="label">Summarize this article</text>
    <rect x="20" y="164" width="274" height="48" rx="18" class="glass"/><text x="38" y="193" class="label">What are the key takeaways?</text>
    <rect x="20" y="224" width="274" height="48" rx="18" class="glass"/><text x="38" y="253" class="label">Find related content</text>
    <rect x="20" y="290" width="274" height="44" rx="22" class="glassStrong"/><text x="38" y="317" class="body">Ask anything…</text><text x="270" y="317" class="h2">↑</text>
  </g>

  <text x="800" y="980" text-anchor="middle" class="subtitle">Concept guidance only — written visual specification takes precedence during implementation.</text>
</svg>
